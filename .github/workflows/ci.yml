name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang valgrind

      - name: Build
        run: make

      - name: Run tests
        run: make test_all

      - name: Run tests with ASan
        run: make asan

      - name: Run tests with Valgrind
        run: |
          for test in build/test_*; do
            echo "Running valgrind on $test..."
            valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 $test
          done
